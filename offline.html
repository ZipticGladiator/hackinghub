<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Offline | Hacking Hub</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0f18">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Inlined so this page still reads correctly even if styles.css
           itself isn't in the cache for some reason. */
        .offline-wrap {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
            padding-top: calc(40px + env(safe-area-inset-top));
            padding-bottom: calc(40px + env(safe-area-inset-bottom));
            background: #050505;
            color: #fff;
            font-family: 'Space Grotesk', system-ui, sans-serif;
        }

        .offline-icon {
            font-size: 3rem;
            color: #0ed7b5;
            margin-bottom: 24px;
        }

        .offline-wrap h1 {
            font-family: 'Rajdhani', system-ui, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .offline-wrap p {
            color: #94a3b8;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            max-width: 420px;
            margin: 0 auto 32px;
            line-height: 1.7;
        }

        .offline-retry {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: #ccff00;
            color: #000;
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>

<body>
    <div class="offline-wrap">
        <i class="fa-solid fa-wifi offline-icon" aria-hidden="true"></i>
        <h1>Signal Lost</h1>
        <p>
            // You're offline. Pages you've already opened are still available —
            reconnect to pull anything new.
        </p>
        <button type="button" class="offline-retry" onclick="window.location.reload()">
            <i class="fa-solid fa-rotate-right" aria-hidden="true"></i> Retry connection
        </button>
    </div>

    <script>
        // Bounce straight back as soon as the network returns.
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>

</html>
